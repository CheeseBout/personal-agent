[project]
name = "personal-agent"
version = "0.0.1"
description = "Self-hosted single-user agentic AI (LangGraph) with a desktop companion, Windows-first."
requires-python = ">=3.12,<3.15"
dependencies = [
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core==1.7.3",
  "langchain-openai==1.7.3",
  "langchain-anthropic==1.7.7",
  "langchain-google-genai==4.4.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "websockets==17.4",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "pyyaml==6.0.3",
  "python-dotenv==1.2.4",
  "keyring==25.7.0",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "ddgs==9.16.1",
  # Phase 4 (all small, pure-Python or a tiny wheel): vector search, documents, calendar, folder watching
  "sqlite-vec==0.1.9",
  "pypdf==6.21.4",
  "python-docx==1.2.0",
  "icalendar==7.3.0",
  "recurring-ical-events==3.8.2",
  "watchdog==7.0.0",
]

[project.optional-dependencies]
# Heavy / later-phase deps stay optional so the idle daemon stays small.
mcp = ["langchain-mcp-adapters==0.3.2"]
observability = ["langfuse==5.1.0"]
local-embeddings = ["fastembed==0.9.1"]
browser = ["playwright==1.64.1"]
screen = ["mss==10.2.0", "pywinauto==0.6.9", "pillow==13.0.0", "imagehash==4.3.2"]
voice = ["edge-tts==7.3.1"]  # spoken answers (free, needs internet). Speech recognition defaults to Gemini audio (cloud).
voice-local = ["faster-whisper==1.2.1"]  # optional offline speech recognition (large download)
ui = ["PySide6==6.12.0", "psutil==7.2.2"]

[dependency-groups]
build = ["pyinstaller==6.22.3"]  # `uv sync --group build` to package (scripts/build.ps1)
dev = ["ruff==0.17.3", "mypy==2.4.1", "pytest==9.2.0", "pytest-asyncio==1.4.1", "types-PyYAML==6.0.12.20261030"]

[project.scripts]
agent-core = "personal_agent.core.main:main"
agent-chat = "personal_agent.cli:main"
agent-eval = "personal_agent.evals:main"
agent-ui = "personal_agent.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pywinauto", "pywinauto.*", "psutil", "sqlite_vec", "fastembed", "faster_whisper", "edge_tts", "playwright.*", "recurring_ical_events", "icalendar", "icalendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "live: calls real LLM providers and costs money; run with -m live",
  "docker: needs a running Docker engine; run with -m docker",
  "desktop: touches the real desktop (clipboard...); run with -m desktop",
]
addopts = "-m 'not live and not docker and not desktop'"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PYI034", "RUF012", "RUF015", "E731", "SLF001", "S101"]
# These validators raise ValueError for every kind of bad input on purpose: the WebSocket layer maps it to one `bad_request`.
"src/personal_agent/core/admin.py" = ["TRY004"]
"src/personal_agent/core/attachments.py" = ["TRY004"]
"src/personal_agent/ui/decisions.py" = ["TRY004"]
