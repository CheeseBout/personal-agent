# Default-deny posture. Tiers: T0 auto, T1 auto (configurable), T2 HITL, T3 denied.
# Single-quoted strings: backslashes are literal in YAML single quotes.
default_tier: T3          # tools/actions with no declared metadata are denied
mcp_default_tier: T2      # external MCP tools need approval unless the user classifies them
tiers:
  T1_auto_approve: true
  T3_allow_with_confirmation: false
paths:
  allow: ['%USERPROFILE%\Documents\agent-workspace']
  deny: ['C:\Windows', 'C:\Program Files', '%APPDATA%\personal-agent\secrets']
commands:
  deny_patterns: ['format\s', 'reg\s+(add|delete)', 'Remove-Item\s+.*-Recurse.*[A-Z]:\$']
network:
  domain_allowlist: []
rate_limits:
  per_tool_per_minute: 30
untrusted_content: treat_all_tool_output_as_data
