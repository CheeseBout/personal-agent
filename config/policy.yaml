# Default-deny posture. Tool tiers are declared in code (tools/*).
# T0 read-only: auto | T1 reversible & contained: auto (unless it follows untrusted content) |
# T2 real-desktop writes, shell, network sandbox: human approval | T3 dangerous: denied.
default_tier: T3          # tools/actions with no declared metadata are denied
mcp_default_tier: T2      # external MCP tools need approval unless the user classifies them
tiers:
  T1_auto_approve: true
  T3_allow_with_confirmation: false   # even when enabled, T3 needs a double confirmation
approval:
  timeout_s: 600          # an unanswered approval expires and counts as a rejection
paths:
  allow: ['%USERPROFILE%\Documents\agent-workspace']  # the first entry is also the agent's working folder (created at start-up)
  deny: ['C:\Windows', 'C:\Program Files', 'C:\Program Files (x86)', '%APPDATA%\personal-agent']
commands:
  # Commands matching a pattern run without approval, as argv (no shell). Anything else is T2 (approval).
  allow_patterns: ['hostname', 'whoami', 'python --version', 'where [A-Za-z0-9_.\-]+']
  timeout_s: 30
  # Never allowed, not even with approval:
  deny_patterns: ['--output', 'format\s', 'format-volume', 'clear-disk', 'reg\s+(add|delete|import)',
                  '(remove-item|\bri\b|\brm\b|\bdel\b|\berase\b)\s+.*-r(ecurse)?', 'rm\s+-rf', '\bdel\s+/[sqf]',
                  '\b(rd|rmdir)\s+/s', 'Set-ExecutionPolicy', 'Invoke-Expression', '\biex\b', 'DownloadString',
                  '-enc(odedcommand)?\b', 'frombase64string', 'Start-Process\s+.*-Verb\s+RunAs', 'net\s+user',
                  'schtasks', 'vssadmin', 'diskpart', 'bcdedit', 'takeown', 'cipher\s+/w', 'Stop-Computer',
                  'Restart-Computer', '\bshutdown\b']
network:
  domain_allowlist: []    # empty = any PUBLIC host (private/loopback/metadata addresses are always blocked); set to restrict
# APIs the agent may call with http_request. It names a secret; the tool injects the value (never shown to the model):
#   http:
#     hosts:
#       api.example.com:
#         secrets:
#           EXAMPLE_API_KEY: {header: Authorization, prefix: 'Bearer '}   # value from .env / Credential Manager
http:
  hosts: {}
rate_limits:
  per_tool_per_minute: 30
sandbox:
  image: personal-agent-sandbox:1
  cpus: 1
  memory: 512m
  pids: 128
  idle_timeout_s: 300
  exec_timeout_s: 60
  max_file_mb: 5
  max_files: 200
  output_dir: sandbox-output          # relative to the workspace; new files may be applied here without approval
untrusted_content: treat_all_tool_output_as_data
