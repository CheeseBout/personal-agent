agent:
  name: personal-agent
  language: auto          # auto | vi | en
server:
  host: 127.0.0.1         # never change to 0.0.0.0
  port: 8765
# Cheap model (Haiku) for every auxiliary step; the strong model only where quality matters.
#
# Tried in order when the primary provider errors (e.g. Anthropic credit exhausted). Fallbacks whose
# API key is missing are skipped. NOTE: as of 2026-10-31 the OpenAI and OpenRouter keys in use had no
# credit, so Gemini is listed first; top those up or drop them. Google retires ids quickly
# (gemini-2.5-flash was already gone) and returned 503 "high demand" on gemini-flash-latest: treat
# this chain as best-effort, not a guarantee.
x-fallbacks: &fb          # Google-primary roles: Haiku first, then OpenAI
  - {provider: anthropic, model: claude-haiku-5-5}
  - {provider: openai, model: gpt-4o}
x-fb-haiku: &fbh          # Haiku-primary planner/critic: Google, then OpenAI (no Sonnet by design)
  - {provider: google, model: gemini-3.5-flash-lite}
  - {provider: openai, model: gpt-4o}
models:
  # Local gemma4:e2b for classifier + vision, thinking off (reasoning_effort: none; with it on, a turn took 25+ s). Measured 2026-11-02:
  # agent-eval 10/10 (same as Haiku), ~3-4 s slower per turn. On a timeout/error the call falls back to Haiku, then Gemini, then gpt-4o
  # (vision falls back to the cloud with the screenshot). Earlier gemma4:e4b with thinking on gave 13-65 s and incomplete JSON.
  classifier: {provider: ollama,    model: "gemma4:e2b",         max_tokens: 600,  timeout_s: 30, reasoning_effort: none, fallbacks: [{provider: anthropic, model: claude-haiku-5-5}, {provider: google, model: gemini-3.5-flash-lite}, {provider: openai, model: gpt-4o}]}
  fast:       {provider: google,    model: gemini-3.5-flash-lite, max_tokens: 2000, fallbacks: *fb}
  summarizer: {provider: google,    model: gemini-3.5-flash-lite, max_tokens: 1000, fallbacks: *fb}
  planner:    {provider: anthropic, model: claude-haiku-5-5,      max_tokens: 2000, fallbacks: *fbh}
  critic:     {provider: anthropic, model: claude-haiku-5-5,      max_tokens: 1200, fallbacks: *fbh}
  worker:     {provider: google,    model: gemini-3.5-flash-lite, max_tokens: 4096, fallbacks: *fb}
  vision:     {provider: ollama,    model: "gemma4:e2b",         max_tokens: 2000, timeout_s: 90, reasoning_effort: none, fallbacks: [{provider: anthropic, model: claude-haiku-5-5}, {provider: google, model: gemini-3.5-flash-lite}, {provider: openai, model: gpt-4o}]}
# USD per million tokens (https://platform.claude.com/docs/en/about-claude/pricing, 2026-10-31).
# Models not listed use `default` (deliberately pessimistic) so unknown models never look free.
pricing:
  claude-haiku-5-5:  {input: 0.10, output: 0.50}   # prompts <= 100k tokens
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  gemini-3.5-flash-lite: {input: 0.10, output: 0.40}   # ESTIMATE - verify against Google pricing
  "gemma4:e4b":      {input: 0.00, output: 0.00}   # local (Ollama)
  "gemma4:e2b":      {input: 0.00, output: 0.00}
  default:           {input: 5.00, output: 20.00}
budgets:                  # per task
  max_steps: 25           # worker LLM calls
  max_tool_calls: 40
  max_seconds: 600
  max_tokens: 150000
  max_cost_usd: 0.50
  max_consecutive_failures: 4
  max_replans: 2
  max_verifications: 4
  daily_max_tokens: 1000000   # across ALL tasks, persisted; checked before every LLM call
  daily_max_cost_usd: 2.00
# Sub-agents. The supervisor delegates INDEPENDENT information-gathering steps to workers that run in parallel,
# each with its own small context and only the tools listed for its role. Workers never ask for approval: if a call would
# need it they stop and report it, and the supervisor handles it in its own (gated) loop. Every worker call is policy-checked.
workers:
  enabled: true
  max_parallel: 3
  max_runs_per_task: 6
  max_total_steps: 30
  min_delegable: 2
  budget: {max_steps: 8, max_tool_calls: 12, max_seconds: 180, max_tokens: 40000, max_cost_usd: 0.15}
  roles:
    web:      {model_role: fast,   private_context: false, tools: [web_search, web_fetch, browser_read, artifact_read]}
    research: {model_role: fast,   tools: [web_search, web_fetch, browser_read, rag_search, rag_list, recall, file_read, file_list, file_search, artifact_read]}
    files:    {model_role: fast,   tools: [file_read, file_list, file_search, artifact_read]}
    memory:   {model_role: fast,   tools: [rag_search, rag_list, recall, artifact_read]}
    comms:    {model_role: fast,   tools: [email_search, email_read, calendar_list, artifact_read]}
    coder:    {model_role: worker, private_context: false, tools: [sandbox_stage, run_python, sandbox_run, sandbox_changes, artifact_read]}
rag:
  embedding: {provider: ollama, model: bge-m3, dim: 1024}   # local: `ollama pull bge-m3`; changing model/dim means re-indexing
  chunk_chars: 900
  overlap_chars: 120
  top_k: 5
  watch: []               # e.g. ['%USERPROFILE%\Documents\agent-workspace\docs'] - must be inside paths.allow
memory:
  reflect: true           # after planned tasks, propose memories (one cheap Haiku call)
  auto_k: 5               # memories injected into the prompt at task start (local search, no API call)
  half_life_days: 90
  min_auto_confidence: 0.7
scheduler:
  max_jobs: 20
  min_interval_minutes: 5
  grace_minutes: 60
brain:
  min_confidence: 0.55    # below this the agent asks one clarifying question
context:
  compact_tokens: 12000   # estimated tokens that trigger summarisation of old turns
  keep_last: 6
  offload_chars: 6000     # larger tool outputs are stored as artifacts, context keeps a digest
observability:
  langfuse_enabled: true  # inert until LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY (/ LANGFUSE_BASE_URL) are set; payloads are redacted
  metrics_enabled: true   # local SQLite latency / error-rate / tool-success events behind /usage
  metrics_keep_days: 90
sandbox:
  idle_timeout_s: 300
  network: false
# Screen perception and control. All keys are optional; defaults live in settings.py (ScreenCfg). Edit in Settings -> Screen.
# screen:
#   agent_view: true              # the agent may look at the screen (every look is shown to you)
#   control: true                 # the agent may ask to click/type (each call still needs your approval)
#   watch_interval_s: 2.0         # continuous mode: seconds between captures
#   watch_change_threshold: 8     # perceptual-hash distance (1-64) that counts as a change
#   watch_max_minutes: 30         # continuous mode switches itself off after this long
#   max_actions: 8                # steps one approval may cover
#   block_titles: [keepass, banking, ...]   # replaces the built-in privacy list when set
